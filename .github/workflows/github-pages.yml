name: Publish AI Reel Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check server address
        env:
          SERVER_ORIGIN: ${{ vars.SERVER_ORIGIN }}
        run: |
          if [[ ! "$SERVER_ORIGIN" =~ ^https://[^/]+/?$ ]]; then
            echo "Add the published Lovable app origin as repository variable SERVER_ORIGIN."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/pages-hosting.test.ts src/test/app-routing.test.tsx src/test/pages-build-config.test.ts
      - name: Build static app
        run: bun run build
        timeout-minutes: 15
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SERVER_ORIGIN: ${{ vars.SERVER_ORIGIN }}
      - name: Prepare only static files
        run: bun scripts/prepare-pages.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment